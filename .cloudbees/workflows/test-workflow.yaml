apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: test workflow
on:
  workflow_dispatch:
metadata:
  stages/v1alpha1:
    - name: ScaN
      jobs:
        - checkout
    - name: Stage
      jobs:
        - job
jobs:
  checkout:
    outputs:
      policy-subject: ${{ steps.gitleaks-step.outputs.policy-subject }}
    steps:
      - uses: cloudbees-io/checkout@v1
        name: checkout
        kind: scan
      - name: run scna
        uses: cloudbees-io/gosec-plugin@v1
        kind: scan
      - run: 'echo "Policy Subject: ${{ steps.gitleaks-step.outputs.policy-subject }}"'
        uses: docker://alpine:3.20
        name: echo scan
  job:
    needs:
      - checkout
    steps:
      - name: Say hello
        uses: docker://golang:1.20.3-alpine3.17
        shell: sh
        run: echo "hello world"
